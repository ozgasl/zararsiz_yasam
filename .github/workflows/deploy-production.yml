name: Alastyr Canlı Yayın

# Bu workflow, main dalına her merge/push olduğunda siteyi build edip
# Alastyr cPanel üzerindeki public_html klasörüne otomatik yükler (FTPS ile,
# şifrenin şifresiz gitmemesi için). Melis'in CMS üzerinden yazdığı taslaklar
# önce ayrı bir dal + PR olarak gelir; bu workflow sadece Özgür PR'ı main'e
# merge ettikten SONRA çalışır.
#
# GEREKLİ GITHUB SECRETS (Settings → Secrets and variables → Actions):
#   FTP_SERVER    -> Alastyr FTP sunucu adresi (örn: ftp.meliszararsiz.com)
#   FTP_USERNAME  -> Alastyr FTP kullanıcı adı
#   FTP_PASSWORD  -> Alastyr FTP şifresi
# Not: cPanel'de genel hesap yerine bu iş için ayrı, sadece public_html'e
# yetkili bir FTP hesabı açmak daha güvenli olur.
#
# Eğer sunucu FTPS (explicit TLS) desteklemiyorsa ve deploy adımı bağlantı
# hatasıyla başarısız olursa, aşağıdaki "protocol: ftps" satırını
# "protocol: ftp" olarak değiştirmek gerekir (şifresiz bağlantıya döner).
#
# AĞUSTOS 2026 GÜNCELLEMESİ: Ard arda gelen CMS kayıtlarında FTP adımı bazen
# (özellikle bir süre sessizlikten sonra gelen ilk denemede) geçici bir
# bağlantı sorunuyla başarısız oluyordu, bir sonraki push'ta kendiliğinden
# düzeliyordu. Bunu iki şekilde ele alıyoruz: (1) art arda push'ların
# birbirini yarıda kesmemesi için "cancel-in-progress" kapatıldı — artık
# yarım kalan bir yükleme yerine sırayla tamamlanıyorlar; (2) FTP adımı
# başarısız olursa 30 saniye bekleyip otomatik olarak yeniden deneniyor
# (en fazla 3 deneme).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: alastyr-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ASTRO_BASE_PATH / ASTRO_SITE verilmiyor -> astro.config.mjs'deki
      # varsayılanlar kullanılır: base "/" ve site meliszararsiz.com
      # (Alastyr domain kökünde barındığı için bu doğru ayardır.)
      - run: npm run build

      - name: FTP ile Alastyr public_html'e yükle (1. deneme)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**

      - name: 1. deneme başarısız oldu, 30 saniye bekle
        if: steps.ftp1.outcome == 'failure'
        run: sleep 30

      - name: FTP ile Alastyr public_html'e yükle (2. deneme)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**

      - name: 2. deneme başarısız oldu, 30 saniye bekle
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 30

      - name: FTP ile Alastyr public_html'e yükle (3. ve son deneme)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
