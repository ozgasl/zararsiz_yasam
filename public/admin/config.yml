backend:
  name: github
  repo: ozgasl/zararsiz_yasam
  branch: main
  # NOT: Sveltia CMS henüz "editorial workflow" (taslak -> PR -> onay) özelliğini
  # desteklemiyor (bu özellik Sveltia'nın 1.0 sürümünden önce eklenecek).
  # Şu an Melis'in kaydettiği her yazı doğrudan main'e commit olarak gidiyor
  # ve Alastyr deploy pipeline'ı otomatik olarak canlıya alıyor - araya bir
  # inceleme adımı girmiyor. Melis'in taslak olarak tutmak istediği yazılar
  # için "Taslak (yayınlanmasın)" alanını işaretlemesi gerekiyor (bkz. aşağı).
  base_url: "https://zararsizyasam.ozgasl.workers.dev"

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog Yazıları"
    label_singular: "Blog Yazısı"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Tarih", name: "date", widget: "datetime" }
      - {
          label: "Slug (URL'de görünecek kısım)",
          name: "slug",
          widget: "string",
          hint: "Sadece küçük harf, rakam ve tire kullanın. Örn: yeni-yazi-basligi",
        }
      - {
          label: "Kategoriler",
          name: "categories",
          widget: "list",
          default: [],
          hint: "Örn: Sağlıklı Yaşam, Kişisel Gelişim, Yaşam Stili",
        }
      - {
          label: "Etiketler",
          name: "tags",
          widget: "list",
          default: [],
          required: false,
        }
      - {
          label: "Taslak (yayınlanmasın)",
          name: "draft",
          widget: "boolean",
          default: true,
          hint: "İşaretliyse yazı sitede görünmez, sadece siz görürsünüz.",
        }
      - {
          label: "İçerik",
          name: "body",
          widget: "markdown",
          # Sveltia'nın zengin metin editörü panoya kopyalanan RESMİ de kabul
          # ediyor. Word'den kopyalarken Word metnin bir de görüntüsünü panoya
          # koyduğu için editör metin yerine o görüntüyü ekliyordu. Düz metin
          # editörünü öne alıyoruz; yapıştırma artık metin olarak geliyor.
          modes: ["raw", "rich_text"],
          hint: "Word'den yapıştırmak için bu sade metin kutusunu kullanın. Kalın yazı **iki yıldız** arasına, ara başlık ## ile yazılır. Fotoğraf eklemek isterseniz sağ üstteki editör seçicisinden zengin metin görünümüne geçip resim simgesini kullanabilirsiniz.",
        }

  # Duyurular yalnızca anasayfadaki ve Kitap sayfasındaki kayan bandı besler.
  # Kendi sayfası yoktur; etkinliğin fotoğrafları ve ayrıntıları blog yazısı
  # olarak yazılır. Tarihi geçen duyurular bantta kendiliğinden kaybolur.
  - name: "events"
    label: "Duyurular"
    label_singular: "Duyuru"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    description: >-
      Buraya girdiğiniz duyurular anasayfada, kitap tanıtımının altındaki kayan
      bantta ve Kitap sayfasında görünür. Ayrı bir sayfası yoktur. Hiç duyuru
      yoksa bant sitede hiç görünmez. Tarihi geçen duyurular bantta otomatik
      olarak görünmez olur, silmeniz gerekmez.
    fields:
      - {
          label: "Başlık",
          name: "title",
          widget: "string",
          hint: "Örn: Melis Zararsız İmza Günü, Kitap Kulübü Buluşması",
        }
      - { label: "Tarih", name: "date", widget: "datetime" }
      - {
          label: "Yer",
          name: "location",
          widget: "string",
          required: false,
          hint: "Örn: Adalar Müzesi, Büyükada / Kadıköy / Online",
        }
      - {
          label: "Detay Linki (opsiyonel)",
          name: "link",
          widget: "string",
          required: false,
          hint: "Buraya SADECE adres yazın, yer adı değil. Örn: /blog/kabuk-imza-gunu/ veya https://... Boş bırakabilirsiniz; yer adı yukarıdaki \"Yer\" alanına yazılır.",
          pattern: ["^$|^(https?://|/)", "Adres / ile veya https:// ile başlamalı. Yer adı yazmak için üstteki \"Yer\" alanını kullanın."],
        }
      - {
          label: "Taslak (yayınlanmasın)",
          name: "draft",
          widget: "boolean",
          default: true,
          hint: "İşaretliyse duyuru bantta görünmez.",
        }

  - name: "meetups"
    label: "Buluşmalar"
    label_singular: "Buluşma Türü"
    folder: "src/content/meetups"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: ["order", "title"]
    description: >-
      Buluşmalar sayfasındaki tanıtım kutuları. Gerçekleşen bir buluşmanın
      fotoğrafları ve ayrıntıları için buraya değil, Blog Yazıları'na yazın ve
      yazıya aşağıdaki "Blog Kategorisi" alanındaki adı verin.
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - {
          label: "İkon",
          name: "icon",
          widget: "select",
          default: "kitap",
          options:
            [
              { label: "Kitap", value: "kitap" },
              { label: "Yazı / Kalem", value: "yazi" },
              { label: "Sohbet", value: "sohbet" },
              { label: "Sanat", value: "sanat" },
              { label: "Ada / Yürüyüş", value: "ada" },
              { label: "Mikrofon (Konuk)", value: "mikrofon" },
            ],
        }
      - {
          label: "Blog Kategorisi",
          name: "category",
          widget: "string",
          required: false,
          hint: "Bu buluşmadan yazdığınız blog yazılarına verdiğiniz kategori adı. Aynı kategoride en az bir yazı olduğunda kutunun altında \"Gerçekleşen buluşmalar\" linki çıkar. Örn: Kitap Kulübü",
        }
      - {
          label: "Sıra",
          name: "order",
          widget: "number",
          default: 0,
          hint: "Küçük sayı önce gösterilir (1, 2, 3...)",
        }
      - {
          label: "Taslak (yayınlanmasın)",
          name: "draft",
          widget: "boolean",
          default: false,
        }
      - {
          label: "Açıklama",
          name: "body",
          widget: "markdown",
          modes: ["raw", "rich_text"],
          hint: "Word'den yapıştırmak için bu sade metin kutusunu kullanın. Kalın yazı **iki yıldız** arasına yazılır.",
        }
